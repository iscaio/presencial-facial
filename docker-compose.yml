services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: presenca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/presenca
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres

  facial-service:
    build: ./facial-service
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
